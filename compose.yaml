name: cmdop-live-demo

services:
  demo:
    build:
      context: .
      # `pull: true` refreshes the base images — including markolofsen/cmdop,
      # which the Dockerfile copies the binary from, so a rebuild still picks up
      # the current release.
      #
      # `no_cache: true` used to sit here because cmdop was installed by a
      # network fetch that the cache would otherwise freeze. The binary now
      # arrives as a COPY from a pinned-by-digest image, so the layer is
      # legitimately cacheable and rebuilds stopped costing a full reinstall.
      pull: true
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        CMDOP_BROWSER: ${CMDOP_BROWSER:-1}
        CMDOP_CLAUDE_CODE: ${CMDOP_CLAUDE_CODE:-1}
        CMDOP_CODEX: ${CMDOP_CODEX:-1}
    image: cmdop-live-demo:local
    init: true
    # Headless Chromium maps renderer memory into /dev/shm; the Docker
    # default of 64 MB crashes it on heavy pages.
    shm_size: "1gb"
    restart: unless-stopped
    # One file per owner — see env/*.env.example for what each one covers.
    # `make setup` copies them; a missing file is skipped rather than fatal.
    env_file:
      - path: env/cmdop.env
        required: false
      - path: env/demo.env
        required: false
      - path: env/agents.env
        required: false
    environment:
      # ONLY computed values belong here, and the reason is load-bearing:
      # `environment:` ALWAYS overrides `env_file:`, whatever the order. A key
      # listed in both places would make the file above look editable while
      # silently having no effect — worse than not splitting at all.
      #
      # Each of these is derived rather than chosen: a rename, a reference to
      # another setting, or a fixed container path.
      CMDOP_ROUTER_API_KEY: ${CMDOP_API_KEY:-}
      VITE_CMDOP_CONSOLE_PORT: ${CMDOP_HOST_PORT:-63141}
      GIT_DIR: /workspace/.git
      GIT_WORK_TREE: /workspace/demo
    secrets:
      - cmdop_admin_password
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DEMO_HOST_PORT:-8080}:5173"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${CMDOP_HOST_PORT:-63141}:63141"
    volumes:
      - cmdop_state:/home/cmdop
      - ./config:/home/cmdop/.config/cmdop
      # Everything Claude Code and Codex own — including the token each writes
      # when you sign in through its own login flow. A host directory rather
      # than a slice of cmdop_state, so a login outlives an image rebuild, a
      # `down --volumes` reset of Cmdop's identity, and is visible enough to
      # back up. The agent service mounts the same path: one login per host,
      # not one per service. Git-ignored, and the pre-commit hook rejects any
      # staged path under it — treat ./agents as private key material.
      - ./agents:/home/cmdop/agents
      - ./demo:/workspace/demo
      - demo_git:/workspace/.git
      - demo_node_modules:/workspace/demo/node_modules
    stop_grace_period: 20s

# Joining an existing fleet is no longer a service in this file.
#
# It used to be a second `agent:` profile here — a near-duplicate of the demo
# service that rebuilt the same 2 GB image (Chromium, two coding CLIs, a Vite
# demo) to run one binary. Adding cmdop to a container is now two lines in YOUR
# OWN Dockerfile, with no repository to clone and no .env to fill in:
#
#   COPY --from=cmdop/cli:latest /cmdop /usr/local/bin/cmdop
#   ENTRYPOINT ["cmdop", "sidecar", "--"]
#   CMD ["your-app"]
#
# `cmdop sidecar` starts the agent in the background and then execs your
# command, so YOUR process keeps PID 1 and Docker's signals, exit codes and
# restart policy are unchanged. Enrolment reads CMDOP_JOIN_KEY and
# CMDOP_SERVER_URL from the environment.
#
# This repository is the live DEMO stand, and now only that.

volumes:
  cmdop_state:
  demo_git:
  demo_node_modules:

secrets:
  cmdop_admin_password:
    environment: CMDOP_ADMIN_PASSWORD
