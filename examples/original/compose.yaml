name: cmdop-live-demo

services:
  demo:
    build:
      context: .
      # Refreshes the images the build copies from, including the one carrying
      # the cmdop binary — so a rebuild picks up the current release without
      # `no_cache`. See docs/architecture.md.
      pull: true
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        CMDOP_BROWSER: ${CMDOP_BROWSER:-1}
        CMDOP_CLAUDE_CODE: ${CMDOP_CLAUDE_CODE:-1}
        CMDOP_CODEX: ${CMDOP_CODEX:-1}
    image: cmdop-live-demo:local
    init: true
    # Headless Chromium maps renderer memory into /dev/shm; the Docker
    # default of 64 MB crashes it on heavy pages.
    shm_size: "1gb"
    restart: unless-stopped
    # Every setting comes from .env, grouped by owner inside that one file.
    environment:
      CMDOP_ROUTER_API_KEY: ${CMDOP_API_KEY:-}
      CMDOP_CODEX_SANDBOX: ${CMDOP_CODEX_SANDBOX:-auto}
      CMDOP_PERMISSIONS_MODE: ${CMDOP_PERMISSIONS_MODE:-default}
      CMDOP_MACHINE_NAME: ${CMDOP_MACHINE_NAME:-cmdop-live-demo}
      CMDOP_AGENT_CWD: ${CMDOP_AGENT_CWD:-/workspace/demo}
      CMDOP_RELAY_MODE: ${CMDOP_RELAY_MODE:-auto}
      CMDOP_PUBLIC_SUBDOMAIN: ${CMDOP_PUBLIC_SUBDOMAIN:-}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
      VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-300}
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-}
      VITE_CMDOP_CONSOLE_PORT: ${CMDOP_HOST_PORT:-63141}
      GIT_DIR: /workspace/.git
      GIT_WORK_TREE: /workspace/demo
      CMDOP_GIT_AUTHOR_NAME: ${CMDOP_GIT_AUTHOR_NAME:-Cmdop Agent}
      CMDOP_GIT_AUTHOR_EMAIL: ${CMDOP_GIT_AUTHOR_EMAIL:-agent@cmdop.local}
    secrets:
      - cmdop_admin_password
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DEMO_HOST_PORT:-8080}:5173"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${CMDOP_HOST_PORT:-63141}:63141"
    volumes:
      - cmdop_state:/home/cmdop
      - ./config:/home/cmdop/.config/cmdop
      # Everything Claude Code and Codex own — including the token each writes
      # when you sign in through its own login flow. A host directory rather
      # than a slice of cmdop_state, so a login outlives an image rebuild, a
      # `down --volumes` reset of Cmdop's identity, and is visible enough to
      # back up. The agent service mounts the same path: one login per host,
      # not one per service. Git-ignored, and the pre-commit hook rejects any
      # staged path under it — treat ./agents as private key material.
      - ./agents:/home/cmdop/agents
      - ./demo:/workspace/demo
      - demo_git:/workspace/.git
      - demo_node_modules:/workspace/demo/node_modules
    stop_grace_period: 20s

# One service: this repository is the live demo stand. Adding cmdop to a
# container you already own needs nothing from here — see the README.

volumes:
  cmdop_state:
  demo_git:
  demo_node_modules:

secrets:
  cmdop_admin_password:
    environment: CMDOP_ADMIN_PASSWORD
