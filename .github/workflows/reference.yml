name: Docker reference
on:
  push:
    branches: [main]
    paths: ['reference/**', '.github/workflows/reference.yml']
  pull_request:
    paths: ['reference/**', '.github/workflows/reference.yml']
permissions:
  contents: read

jobs:
  report:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reference
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the report application
        run: docker compose build report-app
      - name: Verify architecture, CMDOP and the offline MCP call
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' cmdop-report-app:local)" = "$EXPECTED_ARCH"
          docker run --rm --network none cmdop-report-app:local --version
          docker run --rm --network none --cap-drop ALL --entrypoint python cmdop-report-app:local /opt/report/read_report.py |
            jq -se '. == [{"job":"demo-build","tests_passed":3,"tests_failed":0}]'
      - name: Compare the installed binary with the stable Linux release
        run: |
          curl --fail --silent --show-error --location https://install.cmdop.ai/releases/stable.json -o "$RUNNER_TEMP/cmdop-stable.json"
          expected=$(jq -er --arg id "machine-linux-$(uname -m)" '.signed.artifacts[] | select(.id == $id) | .sha256' "$RUNNER_TEMP/cmdop-stable.json")
          actual=$(docker run --rm --network none --entrypoint sha256sum cmdop-report-app:local /usr/local/bin/cmdop)
          test "${actual%% *}" = "$expected"
      - name: Verify the non-root client can replace its binary and keep a backup
        run: |
          docker run --rm --network none --cap-drop ALL --entrypoint sh cmdop-report-app:local -ec '
            test "$(id -u)" = 10001
            bin=$(readlink -f "$(command -v cmdop)")
            for pass in 1 2; do
              cp "$bin" "$bin.new"
              cp "$bin" "$bin.prev"
              mv "$bin.new" "$bin"
              "$bin" --version
            done
          '
